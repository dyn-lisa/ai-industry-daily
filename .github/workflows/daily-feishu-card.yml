name: Daily Feishu Card

on:
  # GitHub Actions cron uses UTC time.
  # 01:07 UTC = 09:07 Singapore / Beijing time.
  # Scheduling a few minutes after the hour helps reduce GitHub Actions peak-hour delays.
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  send-feishu-card:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Send Feishu card
        run: python scripts/send_feishu_card.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPORT_URL: "https://dyn-lisa.github.io/ai-industry-daily/"
          TIMEZONE: "Asia/Singapore"
          TOP_ITEMS: "AI governance and safety updates|AI infrastructure and capital expenditure trends|Agentic AI product and enterprise deployment news"
