name: Daily AI Report

on:
  # GitHub Actions cron uses UTC.
  # 01:07 UTC = 09:07 Singapore / Beijing time.
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional report date, YYYY-MM-DD. Leave blank for today in Asia/Singapore."
        required: false
        type: string
      dry_run:
        description: "Generate JSON without updating index.html or sending Feishu card."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TIMEZONE: "Asia/Singapore"
  REPORT_URL: "https://dyn-lisa.github.io/ai-industry-daily/"
  MAX_CANDIDATES: "60"

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate bilingual AI industry report
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/generate_daily_report.py --html index.html --date "${{ inputs.report_date }}" --dry-run
          else
            python scripts/generate_daily_report.py --html index.html --date "${{ inputs.report_date }}"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional: create a repository variable named OPENAI_MODEL to override this default.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          REPORT_EDITOR: "News Intelligence Assistant"

      - name: Commit updated report files
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/latest_report.json data/reports data/candidates
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update AI industry daily report"
            git push
          fi

      - name: Send Feishu card
        if: ${{ inputs.dry_run != true }}
        run: python scripts/send_feishu_card.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPORT_URL: ${{ env.REPORT_URL }}
          TIMEZONE: ${{ env.TIMEZONE }}
          REPORT_JSON: "data/latest_report.json"
